name: Validar calidad

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar sintaxis y datos
        run: |
          python -m py_compile scripts/build_seo_pages.py scripts/validate_site_data.py
          python -m unittest discover -s tests -v
          python scripts/validate_site_data.py --strict
          python -c "import pathlib,re; s=pathlib.Path('index.html').read_text(encoding='utf-8'); m=re.search(r'<script>([\\s\\S]*?)</script>\\s*</body>',s); assert m; pathlib.Path('/tmp/index.js').write_text(m.group(1),encoding='utf-8')"
          node --check /tmp/index.js
          node --check room-state.js
          node --check service-worker.js

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      VAULT_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tests/browser/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Probar pendientes y modal con Firebase simulado
        run: python -B -m unittest discover -s tests/browser -v

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Probar reglas de Realtime Database en el emulador
        run: npm run test:firebase-rules
