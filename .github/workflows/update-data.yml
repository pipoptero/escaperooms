name: Actualizar datos desde Excel

on:
  push:
    paths:
      - "**.xlsx"
      - "**.xls"
      - "convert.py"
      - "scripts/build_review_photos.py"
      - "scripts/build_seo_pages.py"
      - "images/Hechos/**"

jobs:
  detect_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      managed: ${{ steps.mode.outputs.managed }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect exact managed release trailer
        id: mode
        run: python scripts/managed_release_guard.py detect --output "$GITHUB_OUTPUT"

  validate_managed:
    needs: detect_release
    if: needs.detect_release.outputs.managed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo without push credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate managed release without writers
        run: |
          echo "Managed release detected"
          echo "Auto-update writers disabled"
          echo "No child commit will be created"
          python scripts/managed_release_guard.py verify --expected-sha "$GITHUB_SHA"

  convert-and-deploy:
    needs: detect_release
    if: needs.detect_release.outputs.managed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install openpyxl pillow

      - name: Convertir Excel, optimizar fotos y generar paginas SEO
        run: |
          python convert.py
          python scripts/optimize_generated_covers.py
          python scripts/build_review_photos.py
          python scripts/build_seo_pages.py --update-main-stats

      - name: Commit y push datos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json review_photos.json site_stats.json robots.txt sitemap*.xml video-sitemap.xml llms.txt seo.css reviews/ ranking/ ranking-escape-rooms/ mejores-escape-rooms/ mejores-escape-rooms-terror/ escape-rooms/ escape-rooms-*/ salas/ images/seo/
          git diff --staged --quiet && echo "Sin cambios en datos generados" || (
            git commit -m "Auto-update datos y SEO"
            git push
          )
