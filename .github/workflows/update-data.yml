name: Actualizar datos desde Excel

on:
  push:
    paths:
      - "**.xlsx"
      - "**.xls"
      - "convert.py"
      - "scripts/build_review_photos.py"
      - "scripts/build_seo_pages.py"
      - "images/Hechos/**"

jobs:
  convert-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install openpyxl pillow

      - name: Convertir Excel, fotos y paginas SEO
        run: |
          python convert.py
          python scripts/build_review_photos.py
          python scripts/build_seo_pages.py

      - name: Commit y push datos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json review_photos.json site_stats.json robots.txt sitemap.xml video-sitemap.xml llms.txt reviews/ ranking/ ranking-escape-rooms/ mejores-escape-rooms/ mejores-escape-rooms-terror/ escape-rooms/ escape-rooms-*/ salas/ images/seo/
          git diff --staged --quiet && echo "Sin cambios en datos generados" || (
            git commit -m "Auto-update datos y SEO"
            git push
          )
